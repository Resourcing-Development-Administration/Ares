<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ares Capture</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      width: 320px;
      padding: 16px;
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
      color: #a78bfa;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1::before {
      content: "▲";
      font-size: 12px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    label {
      font-size: 13px;
      color: #94a3b8;
    }
    input[type="text"] {
      width: 100%;
      background: #1e2130;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 12px;
      padding: 6px 10px;
      margin-top: 4px;
      margin-bottom: 10px;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #a78bfa;
    }
    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
    }
    .toggle input { display: none; }
    .slider {
      position: absolute;
      inset: 0;
      background: #334155;
      border-radius: 24px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    input:checked + .slider { background: #7c3aed; }
    input:checked + .slider::before { transform: translateX(20px); }
    .status {
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 6px;
      margin-bottom: 12px;
      text-align: center;
    }
    .status.on { background: #1a2335; color: #34d399; }
    .status.off { background: #1a1a2e; color: #64748b; }
    button {
      width: 100%;
      padding: 8px;
      background: #1e1b4b;
      border: 1px solid #4c1d95;
      border-radius: 6px;
      color: #c4b5fd;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #2e1065; }
    .field-label { font-size: 12px; color: #64748b; margin-bottom: 2px; }
  </style>
</head>
<body>
  <h1>Ares Traffic Capture</h1>

  <div class="row">
    <label for="toggle-capture">Captura activa</label>
    <label class="toggle">
      <input type="checkbox" id="toggle-capture">
      <span class="slider"></span>
    </label>
  </div>

  <div id="status" class="status off">Captura desactivada</div>

  <div class="field-label">URL de Ares</div>
  <input type="text" id="ares-url" placeholder="http://localhost:7443">

  <div class="field-label">Scope (regex o texto)</div>
  <input type="text" id="scope-pattern" placeholder="api\.ejemplo\.com">

  <div class="field-label">Token Ares (X-Ares-Token)</div>
  <input type="text" id="ares-token" placeholder="JWT o bearer token">

  <div id="cdp-status" style="font-size:11px;color:#64748b;margin-bottom:10px">CDP: —</div>

  <div style="display:flex;gap:6px">
    <button id="reattach-btn" style="flex:1" title="Vuelve a enganchar el debugger a todas las tabs abiertas">Re-attach CDP</button>
    <button id="open-ares" style="flex:1">Ver en Ares ↗</button>
  </div>
</body>
<script src="popup.js"></script>
</html>
