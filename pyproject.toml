[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ares-mcp-redteam"
version = "0.4.0"
description = "Motor de pruebas de seguridad red-team para servidores Model Context Protocol (MCP)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]<2",
    "httpx",
    "jsonschema",
    "rich",
    "pydantic",
    "pyyaml",
    "fastapi",
    "uvicorn",
    "websockets",  # uvicorn sin esto no soporta el handshake de WebSocket (/ws/scan, /ws/full
                   # del dashboard fallan con "Unsupported upgrade request" / 404 silencioso)
    "passlib[bcrypt]",
    "python-jose[cryptography]",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
live-agent = ["anthropic"]  # openai/ollama usan httpx (ya core dep), sin paquete extra
sast = ["semgrep"]
postgres = ["asyncpg"]     # persistence layer PostgreSQL opcional
crypto = ["cryptography"]  # AES-256-GCM for secrets at rest
dns = ["dnspython"]        # enrich DNS resolution

[project.scripts]
ares = "cli.main:main"

[tool.setuptools]
packages = [
    "engine",
    "engine.core",
    "engine.recon",
    "engine.static",
    "engine.dynamic",
    "engine.adversarial",
    "engine.auth",
    "engine.api",
    "engine.protocol",
    "engine.exposure",
    "engine.supplychain",
    "engine.reporting",
    "engine.policy",
    "engine.discovery",
    "engine.netrecon",
    "engine.tools",
    "engine.enrich",
    "engine.intercept",
    "engine.agent",
    "engine.notify",
    "engine.scheduler",
    "engine.persistence",
    "engine.proxy",
    "engine.egress",
    "engine.ingest",
    "engine.facts",
    "engine.rsi",
    "engine.enrich",
    "cli",
    "payloads",
    "webui",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
